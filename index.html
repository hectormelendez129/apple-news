<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="description" content="This is where your description goes">
	<meta name="keywords" content="one, two, three">

	<title>Current Apple News</title>

	<!-- external CSS link -->
	<link rel="stylesheet" href="css/normalize.css">
	<link rel="stylesheet" href="css/style.css">
</head>

<body>


	<!-- Search form -->
	<form id="searchForm">
		<fieldset>
			<legend>Enter Date</legend>

			<input type="date" id="date">
		</fieldset>

		<!-- Keyword, search type, language and article display amount -->
		<fieldset>
			<legend>Search Options</legend>

			<input type="text" id="keyword" placeholder="Keyword">

			<section>
				<input type="radio" name="searchType" id="searchTitle" value="title" checked>
				<label for="searchTitle">Title</label>

				<input type="radio" name="searchType" id="searchDescription" value="description">
				<label for="searchDescription">Description</label>
			</section>
		</fieldset>

		<fieldset>
			<legend>Article Language</legend>

			<section id="langauges">
				<input type="radio" name="lang" id="english" value="en" checked>
				<label for="english">English</label>
				<br>
				<input type="radio" name="lang" id="spanish" value="es">
				<label for="spanish">Español</label>
				<br>
				<input type="radio" name="lang" id="french" value="fr">
				<label for="french">Français</label>
			</section>
		</fieldset>

		<fieldset>
			<legend>Articles to Display</legend>
			<input type="radio" name="numOfArts" value="5" checked>
			<label for="5">5</label>

			<input type="radio" name="numOfArts" value="10">
			<label for="10">10</label>

			<input type="radio" name="numOfArts" value="20">
			<label for="20">20</label>

		</fieldset>

		<!-- Submit button -->
		<button type="button" id="submitBtn">Submit</button>
	</form>

	<!-- Articles section -->
	<section id="articles">
		<h1>Articles</h1>
		<div class="articleList">
			<!--
			For Testing purposes only 
			Articles load here
			author, title, date published, 
			url, content			
			<h3 id="title"></h3>
			<h3 id="author"></h3>
			<h3 id="published"></h3>
			<h3 id="urlH3"></h3>
			<h3 id="content"></h3>
			<img id="img" src=""
			width="200px"
			height="200px">
			-->
		</div>
	</section>

	<script type="text/javascript" src="js/main.js"></script>
</body>

</html>
